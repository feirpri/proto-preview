<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <title>今日 · Musi 投资助手原型</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="today">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>今日</h1>
            <p class="lede">市场状态、持仓/现金总览与逐基金建议；实时估值在打开页面时触发，14:30 生成定期分析。所有内容只读，执行动作仅能通过 MCP 写入口完成。</p>
          </div>
          <div class="head-side" id="today-head-side"></div>
        </div>

        <section class="grid grid-12" id="today-stats" aria-label="今日总览"></section>

        <section class="section" id="today-advice" aria-label="今日决策摘要"></section>

        <section class="section">
          <div class="section-head">
            <div>
              <h2>逐基金概览与建议</h2>
              <div class="hint">每张卡从上到下：① 实时估值（打开页面触发）→ ② 持仓 vs 目标 → ③ 今日建议（14:30 定期分析）；客户端不提供交易按钮。</div>
            </div>
            <span class="ro-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><rect x="4.5" y="10" width="15" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>只读原型</span>
          </div>
          <div class="fund-grid" id="fund-grid"></div>
        </section>

        <section class="grid grid-12 section" id="today-quality" aria-label="数据说明"></section>
      </main>
      <footer class="site-foot" id="site-footer"></footer>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="移动端主导航"></nav>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>

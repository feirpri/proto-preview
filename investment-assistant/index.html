<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <title>首页 · Musi 投资助手原型</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="home">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h1>首页</h1>
            <p class="lede">行情与估值看板：大盘指数 + 5 只基金估值。进入页面自动刷新一次，也可手动刷新；操作建议见「建议」页，经济要闻见「要闻」页。全部内容只读。</p>
            <p class="refresh-note">原型演示：时间为模拟值；生产环境由估值接口返回，打开页面与手动刷新时调用。</p>
          </div>
          <div class="head-side" id="home-head-side"></div>
        </div>

        <section class="section" style="margin-top:0" aria-label="大盘指数">
          <div class="section-head">
            <div>
              <h2>大盘指数</h2>
              <div class="hint">红涨绿跌：每项显示点位、涨跌幅与涨跌点数</div>
            </div>
            <div class="updown-legend" aria-label="涨跌颜色图例">
              <span class="ud-item"><span class="ud-swatch up"></span>涨</span>
              <span class="ud-item"><span class="ud-swatch down"></span>跌</span>
              <span class="ud-item"><span class="ud-swatch flat"></span>平</span>
            </div>
          </div>
          <div class="index-grid" id="index-grid" aria-live="polite"></div>
        </section>

        <section class="section" aria-label="基金估值">
          <div class="section-head">
            <div>
              <h2>基金估值</h2>
              <div class="hint">5 只基金 · 估算净值 / 涨跌幅 / 今日预估收益；stale 基金不冒充实时</div>
            </div>
            <div class="fund-live-meta" id="home-fund-meta"></div>
          </div>
          <div class="fund-grid" id="fund-grid" aria-live="polite"></div>
        </section>

        <section class="grid grid-12 section" id="home-quality" aria-label="数据口径说明"></section>
      </main>
      <footer class="site-foot" id="site-footer"></footer>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="移动端主导航"></nav>
  </div>
  <span id="refresh-status" class="sr-only" aria-live="polite"></span>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
